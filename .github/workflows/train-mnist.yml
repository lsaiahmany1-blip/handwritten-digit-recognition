name: Train new real handwriting model (MNIST)

on:
  push:
    paths:
      - 'train_mnist.py'
      - '.github/workflows/train-mnist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CPU training dependencies
        run: |
          python -m pip install numpy
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Train and evaluate MNIST classifier
        run: python train_mnist.py
      - name: Commit verified exported model weights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/model-mnist.json docs/mnist-metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: add verified MNIST handwriting recognition model'
            git push
          fi
